name: Test formulae

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6
        with:
          stable: true
      - name: Check style
        run: brew style Formula/*.rb
      - name: Audit formulae
        run: brew audit --strict ferntrail/tap/bitgarth-cli ferntrail/tap/bitgarth-web
      - name: Install packages
        run: brew install ferntrail/tap/bitgarth-cli ferntrail/tap/bitgarth-web
      - name: Test packages
        run: |
          brew test ferntrail/tap/bitgarth-cli
          brew test ferntrail/tap/bitgarth-web
